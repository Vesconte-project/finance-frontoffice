name: Frontend QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Frontend candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route changed files
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          else
            base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          needed=false
          while IFS= read -r file; do
            case "$file" in
              app/*|components/*|hooks/*|public/*|e2e/*|playwright.config.*|next.config.*|postcss.config.*|proxy.ts|vercel.json)
                needed=true
                break ;;
            esac
          done < <(git diff --name-only "$base" "$HEAD_SHA")
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.route.outputs.needed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.route.outputs.needed == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.route.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run complete frontend candidate check
        if: steps.route.outputs.needed == 'true'
        env:
          # A dedicated disposable Clerk development application, scoped to this
          # step alone rather than the job or workflow. clerkMiddleware() needs a
          # publishable key wherever it runs, and without one it throws on every
          # matched route.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_CI_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_CI_SECRET_KEY }}
          # Keyless stays off. Runners set CI, which the Next server reads to
          # disable keyless while the browser bundle never sees it and would
          # enable it; the extra client-only provider that follows shifts every
          # useId() and breaks hydration. NEXT_PUBLIC_ is inlined into both, so
          # both agree.
          NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: '1'
          # qa:frontend already runs `npm run build`. Point the browser suite at
          # that production build via `next start`, instead of spawning a second
          # `next dev` server, so QA exercises the runtime Vercel serves.
          PLAYWRIGHT_SERVER_MODE: production
          PLAYWRIGHT_CAPTURE: '1'
        run: npm run qa:frontend

      - name: Keep viewport screenshots for review
        if: always() && steps.route.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-viewport-screenshots
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Record not-applicable result
        if: steps.route.outputs.needed != 'true'
        run: echo "No frontend/runtime candidate paths changed; frontend QA is not applicable."

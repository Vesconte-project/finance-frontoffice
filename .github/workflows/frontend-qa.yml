name: Frontend QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Prepare frontend candidate
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.59 cannot install
    # Chromium or its system dependencies. Unpin when Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      browser: ${{ steps.route.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Route changed files
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: node scripts/ci-scope.mjs

      - uses: actions/setup-node@v4
        if: steps.route.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.route.outputs.build == 'true'
        run: npm ci

      - name: Verify source and contracts
        if: steps.route.outputs.build == 'true'
        timeout-minutes: 5
        run: npm run verify

      - name: Build production candidate
        timeout-minutes: 5
        if: steps.route.outputs.build == 'true'
        env:
          # The public build artifact uses only the publishable development key.
          # The secret key is supplied separately to each browser test runtime.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_CI_PUBLISHABLE_KEY }}
          # Keyless stays off. Runners set CI, which the Next server reads to
          # disable keyless while the browser bundle never sees it and would
          # enable it; the extra client-only provider that follows shifts every
          # useId() and breaks hydration. NEXT_PUBLIC_ is inlined into both, so
          # both agree.
          NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: '1'
        run: npm run build

      - name: Package production candidate
        if: steps.route.outputs.browser == 'true'
        run: |
          test -s .next/BUILD_ID
          tar -czf "$RUNNER_TEMP/frontend-candidate.tgz" --exclude=.next/cache .next
          du -h "$RUNNER_TEMP/frontend-candidate.tgz"

      - name: Upload production candidate
        if: steps.route.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: ${{ runner.temp }}/frontend-candidate.tgz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  browser:
    name: Browser QA (${{ matrix.shard }}/2)
    needs: prepare
    if: needs.prepare.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production candidate
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-build
          path: ${{ runner.temp }}

      - name: Extract production candidate
        run: |
          tar -xzf "$RUNNER_TEMP/frontend-candidate.tgz"
          test -s .next/BUILD_ID

      - name: Install Chromium
        # Includes fresh apt packages/fonts: runner mirror latency can exceed 3m
        # before the browser download starts. Keep this bounded and browser QA mandatory.
        timeout-minutes: 10
        run: |
          # The runner's Azure apt mirror stalled font downloads in two runs.
          # Use the official Ubuntu archive; keep apt signature checks intact.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium

      - name: Check browser runtime and interface
        timeout-minutes: 12
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_CI_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_CI_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: '1'
          PLAYWRIGHT_SERVER_MODE: production
          PLAYWRIGHT_CAPTURE: '1'
          BROWSER_SHARD: ${{ matrix.shard }}
        run: npm run qa:browser -- --workers=1 "--shard=${BROWSER_SHARD}/2"

      - name: Keep browser report and failure evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  candidate:
    name: Frontend candidate
    needs: [prepare, browser]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require applicable checks to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BROWSER_REQUIRED: ${{ needs.prepare.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          case "$PREPARE_RESULT:$BROWSER_REQUIRED:$BROWSER_RESULT" in
            success:true:success) echo "Build and both browser shards passed." ;;
            success:false:skipped) echo "Preparation passed; browser QA is not applicable." ;;
            *) echo "Frontend QA did not pass (prepare=$PREPARE_RESULT, browser required=$BROWSER_REQUIRED, browser=$BROWSER_RESULT)."; exit 1 ;;
          esac

name: Frontend QA

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Frontend candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route changed files
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: node scripts/ci-scope.mjs

      - uses: actions/setup-node@v4
        if: steps.route.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.route.outputs.build == 'true'
        run: npm ci

      - name: Verify source and contracts
        if: steps.route.outputs.build == 'true'
        timeout-minutes: 5
        run: npm run verify

      - name: Build production candidate
        timeout-minutes: 5
        if: steps.route.outputs.build == 'true'
        env:
          # A dedicated disposable Clerk development application, scoped to this
          # build/browser steps rather than the job or workflow. clerkMiddleware() needs a
          # publishable key wherever it runs, and without one it throws on every
          # matched route.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_CI_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_CI_SECRET_KEY }}
          # Keyless stays off. Runners set CI, which the Next server reads to
          # disable keyless while the browser bundle never sees it and would
          # enable it; the extra client-only provider that follows shifts every
          # useId() and breaks hydration. NEXT_PUBLIC_ is inlined into both, so
          # both agree.
          NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: '1'
        run: npm run build

      - name: Install Chromium
        if: steps.route.outputs.browser == 'true'
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium

      - name: Check browser runtime and interface
        if: steps.route.outputs.browser == 'true'
        timeout-minutes: 12
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_CI_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_CI_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: '1'
          PLAYWRIGHT_SERVER_MODE: production
          PLAYWRIGHT_CAPTURE: '1'
        run: npm run qa:browser

      - name: Keep browser report and failure evidence for review
        if: always() && steps.route.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Record not-applicable result
        if: steps.route.outputs.build != 'true'
        run: echo "No frontend/runtime candidate paths changed; frontend QA is not applicable."

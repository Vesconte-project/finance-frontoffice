name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Proportional validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route changed files
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          else
            base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          verify=false
          frontend=false
          while IFS= read -r file; do
            case "$file" in
              app/*|components/*|hooks/*|public/*|e2e/*|playwright.config.*|next.config.*|postcss.config.*|proxy.ts|vercel.json)
                frontend=true ;;
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.json|*.toml|*.yml|*.yaml|lib/*|tests/*|scripts/*|supabase/*|.github/workflows/*)
                verify=true ;;
            esac
          done < <(git diff --name-only "$base" "$HEAD_SHA")

          if [[ "$frontend" == true ]]; then verify=false; fi
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          echo "needed=$verify" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.route.outputs.needed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.route.outputs.needed == 'true'
        run: npm ci

      - name: Verify non-visual changes
        if: steps.route.outputs.verify == 'true'
        run: npm run verify

      - name: Record not-applicable result
        if: steps.route.outputs.needed != 'true'
        run: echo "No non-visual runtime validation applies to these changes."

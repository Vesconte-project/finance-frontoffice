name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finance-frontoffice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Proportional validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route changed files
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: node scripts/ci-scope.mjs

      - uses: actions/setup-node@v4
        if: steps.route.outputs.verify == 'true' && steps.route.outputs.build != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.route.outputs.verify == 'true' && steps.route.outputs.build != 'true'
        run: npm ci

      - name: Verify non-visual changes
        if: steps.route.outputs.verify == 'true' && steps.route.outputs.build != 'true'
        run: npm run verify

      - name: Record not-applicable result
        if: steps.route.outputs.verify != 'true' || steps.route.outputs.build == 'true'
        run: echo "No non-visual runtime validation applies to these changes."
